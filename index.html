        .load-page-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), rgba(57, 255, 20, 0.2), transparent);
            transition: left 0.7s ease;
            transform: skewX(-20deg);
            z-index: 1;
        }
        
        .load-page-button::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #39FF14, #66fcf1, #39FF14, #66fcf1, #39FF14);

            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.4s;
            animation: glowRotate 6s linear infinite;
        }
        
        .load-page-button .matrix-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(57, 255, 20, 0.05) 0px, rgba(102, 252, 241, 0.05) 2px, transparent 3px, transparent 8px);
            background-size: 100% 10px;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            z-index: -1;
        }
        
        .load-page-button:hover {
            transform: translateY(-5px) scale(1.08);
            background: rgba(0, 0, 0, 0.9);
            border-color: #39FF14;
            color: white;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(57, 255, 20, 0.6), 0 0 40px rgba(57, 255, 20, 0.4), 0 0 80px rgba(57, 255, 20, 0.2);
            animation: quantumJump 0.8s ease, hologramFlicker 2s infinite;
        }
        
        .load-page-button:hover::before { left: 100%; }
        .load-page-button:hover::after { opacity: 0.7; }
        .load-page-button:hover .matrix-effect {
            opacity: 0.3;
            animation: matrixRain 0.8s linear infinite;
        }
        
        .load-page-button.active {
            background: linear-gradient(135deg, #ff416c, #e50914);
            color: white;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.6), 0 0 40px rgba(229, 9, 20, 0.4), 0 0 60px rgba(255, 65, 108, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.5);
            animation: neonPulse 1.5s infinite, morphBorder 4s ease infinite;
            transform: scale(1.1);
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }
        
        .load-page-button.active::after {
            opacity: 0.9;
            filter: blur(12px);
            background: linear-gradient(45deg, #ff416c, #e50914, #ff416c, #e50914);
            animation: glowRotate 4s linear infinite;
        }
        
        .nav-arrow {
            position: relative;
            background: linear-gradient(145deg, #1a2a3a, #0f1a24);
            color: #39FF14;
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 70px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(57, 255, 20, 0.5);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4), inset 0 2px 5px rgba(255, 255, 255, 0.1), inset 0 -2px 5px rgba(0, 0, 0, 0.3);

            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .nav-arrow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            transform: rotate(45deg);
            z-index: -1;
        }
        
        .nav-arrow::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;

        .nav-arrow:hover {

            background: linear-gradient(145deg, #0f1a24, #1a2a3a);
            border-color: #39FF14;

        .nav-arrow:hover::before {

        .footer {

        .footer::before {

        /* متجاوب */
        
        @media (max-width: 1200px) {
            .offers-container {

        @media (max-width: 768px) {

    <!-- ===== شاهد الان - مع أزرار فخمة ===== -->
    <section id="offers-section">

    <!-- الفوتر -->
    <section class="footer"><p>جميع الحقوق محفوظة &copy; 2025 HaM سينما</p></section>

    <script>
        window.currentEpisode = 1;

        const movies = [
            { title: "كونغ فو باندا", image: "img/dany5/dany04.jpg", link: "show6/show1.html" },
            { title: "حكاية لعبه", image: "img/dany5/dany016.jpg", link: "show6/show2.html" },

            { title: "ملكة الثلج", image: "img/dany5/dany02.jpg", link: "show6/show10.html" },

            { title: "فوق up", image: "img/dany5/dany023.jpg", link: "show6/show013.html" },
            { title: "فلم بن تن", image: "img/dany5/dany024.jpg", link: "show6/show014.html" },
            { title: "قلبا وقالبا", image: "img/dany5/dany022.jpg", link: "show6/show015.html" },
            { title: "الاسد الملك", image: "img/dany5/dany025.jpg", link: "show6/show016.html" },
            { title: "كوكو", image: "img/dany5/dany026.jpg", link: "show6/show017.html" },
            { title: "كرتون روح", image: "img/dany5/dany027.jpg", link: "show6/show018.html" },
            { title: "الاسد الملك 2", image: "img/dany5/dany025.jpg", link: "show6/show016.html" },
            { title: "كوكو 2", image: "img/dany5/dany026.jpg", link: "show6/show017.html" },
            { title: "كرتون روح 2", image: "img/dany5/dany027.jpg", link: "show6/show018.html" }
        ];

        const newMovies = [...movies];

        const offersDatabase = [
            { title: "كونغ فو باندا", image: "img/dany5/dany04.jpg", link: "show6/show1.html" },
            { title: "حكاية لعبه", image: "img/dany5/dany016.jpg", link: "show6/show2.html" },
            { title: "النمله والجراد", image: "img/dany5/dany013.jpg", link: "show6/show3.html" },
            { title: "عائلة روبنسون", image: "img/dany5/dany017.jpg", link: "show6/show4.html" },
            { title: "مزرعه فى خطر", image: "img/dany5/dany018.jpg", link: "show6/show5.html" },
            { title: "ليله فى المتحف", image: "img/dany5/dany019.jpg", link: "show6/show6.html" },
            { title: "مريدا", image: "img/dany5/dany011.jpg", link: "show6/show7.html" },
            { title: "بيت التنانين", image: "img/dany5/dany01.jpg", link: "show6/show8.html" },
            { title: "عصر الجليد", image: "img/dany5/dany08.jpg", link: "show6/show9.html" },
            { title: "ملكة الثلج", image: "img/dany5/dany02.jpg", link: "show6/show10.html" },
            { title: "الامبراطور 2000", image: "img/dany5/dany021.jpg", link: "show6/show011.html" },
            { title: "الامبراطور2004", image: "img/dany5/dany020.jpg", link: "show6/show012.html" },
            { title: "فوق up", image: "img/dany5/dany023.jpg", link: "show6/show013.html" },
            { title: "فلم بن تن", image: "img/dany5/dany024.jpg", link: "show6/show014.html" },
            { title: "قلبا وقالبا", image: "img/dany5/dany022.jpg", link: "show6/show015.html" },
            { title: "الاسد الملك", image: "img/dany5/dany025.jpg", link: "show6/show016.html" },
            { title: "كوكو", image: "img/dany5/dany026.jpg", link: "show6/show017.html" },
            { title: "كرتون روح", image: "img/dany5/dany027.jpg", link: "show6/show018.html" }
        ];

        // تكبير قاعدة البيانات لتظهر فكرة الصفحات
        for (let i = 0; i < 30; i++) {
            offersDatabase.push(...offersDatabase.slice(0, 20).map(item => ({ ...item, title: item.title + " " + (i + 3) })));
        }

        let autoScrollIntervalMovies;
        let autoScrollIntervalNewMovies;
        let autoScrollIntervalOffers;
        let currentPage = 1;
        const ITEMS_PER_PAGE = 27; // 27 بطاقة (3 صفوف * 9 كروت)
        let totalPages = 5;
        let currentDisplayPage = 1;

        function createCard(item) {
            return `<div class="card" data-link="${item.link}"><div class="poster"><img src="${item.image}" alt="${item.title}" loading="lazy"></div><div class="card-title">${item.title}</div></div>`;
        }

        function createOfferCard(item) {
            return `<div class="offer-card" data-link="${item.link}"><img src="${item.image}" alt="${item.title}" loading="lazy"></div>`;
        }

        function renderCards(containerId, items) {
            const container = document.getElementById(containerId);
            if (container) {
                if (containerId === 'cards-offers') {
                    container.innerHTML = items.map(item => createOfferCard(item)).join('');
                } else {
                    container.innerHTML = items.map(item => createCard(item)).join('');
                }
                setTimeout(() => addCardClickListeners(), 50);
            }
        }

        function getPageItems(page) {
            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            let items = [];
            for (let i = 0; i < ITEMS_PER_PAGE; i++) {
                const index = (startIndex + i) % offersDatabase.length;
                items.push({ ...offersDatabase[index] });
            }
            return items;
        }

        function renderOffersPage(page) {
            const pageItems = getPageItems(page);
            renderCards('cards-offers', pageItems);

            document.querySelectorAll('.load-page-button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`page-${page}`);
            if (activeBtn) activeBtn.classList.add('active');

            currentPage = page;

            // إضافة صفحة جديدة لو وصلنا لآخر صفحة
            if (page === totalPages) {
                addNewPage();
            }
        }

        function renderPageButtons(startPage) {
            const paginationDiv = document.getElementById('pagination-container');
            const navNext = document.getElementById('nav-next');

            const oldButtons = document.querySelectorAll('.load-page-button');
            oldButtons.forEach(btn => btn.remove());

            for (let i = startPage; i < startPage + 5; i++) {
                const newButton = document.createElement('button');
                newButton.id = `page-${i}`;
                newButton.className = 'load-page-button';
                newButton.setAttribute('data-page', i);
                newButton.innerHTML = `${i}<span class="matrix-effect"></span>`;
                newButton.addEventListener('click', function() {
                    renderOffersPage(parseInt(this.getAttribute('data-page')));
                    stopAutoScroll('cards-offers');
                    setTimeout(() => startAutoScroll('cards-offers'), 5000);

                    document.querySelectorAll('.load-page-button').forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                });

                paginationDiv.insertBefore(newButton, navNext);
            }

            currentDisplayPage = startPage;
        }

        function addNewPage() {
            totalPages++;
            const paginationDiv = document.getElementById('pagination-container');
            const navNext = document.getElementById('nav-next');

            const newButton = document.createElement('button');
            newButton.id = `page-${totalPages}`;
            newButton.className = 'load-page-button';
            newButton.setAttribute('data-page', totalPages);
            newButton.innerHTML = `${totalPages}<span class="matrix-effect"></span>`;
            newButton.addEventListener('click', function() {
                renderOffersPage(parseInt(this.getAttribute('data-page')));
                stopAutoScroll('cards-offers');
                setTimeout(() => startAutoScroll('cards-offers'), 5000);

                document.querySelectorAll('.load-page-button').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });

            paginationDiv.insertBefore(newButton, navNext);
        }

        function startAutoScroll(containerId, speed = 3500) {
            const container = document.getElementById(containerId);
            if (!container) return;
            stopAutoScroll(containerId);
            const intervalId = setInterval(() => {
                if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 50) {
                    container.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    container.scrollBy({ left: 200, behavior: 'smooth' });
                }
            }, speed);
            if (containerId === 'cards-movies') autoScrollIntervalMovies = intervalId;
            else if (containerId === 'cards-new-movies') autoScrollIntervalNewMovies = intervalId;
            else if (containerId === 'cards-offers') autoScrollIntervalOffers = intervalId;
        }

        function stopAutoScroll(containerId) {
            if (containerId === 'cards-movies' && autoScrollIntervalMovies) {
                clearInterval(autoScrollIntervalMovies); autoScrollIntervalMovies = null;
            } else if (containerId === 'cards-new-movies' && autoScrollIntervalNewMovies) {
                clearInterval(autoScrollIntervalNewMovies); autoScrollIntervalNewMovies = null;
            } else if (containerId === 'cards-offers' && autoScrollIntervalOffers) {
                clearInterval(autoScrollIntervalOffers); autoScrollIntervalOffers = null;
            }
        }

        function addCardClickListeners() {
            const allCards = document.querySelectorAll('.card');
            allCards.forEach(card => {
                card.removeEventListener('click', handleCardClick);
                card.addEventListener('click', handleCardClick, false);
                card.classList.remove('selected');
            });
            const offerCards = document.querySelectorAll('.offer-card');
            offerCards.forEach(card => {
                card.removeEventListener('click', handleCardClick);
                card.addEventListener('click', handleCardClick, false);
            });
        }

        function handleCardClick(e) {
            e.preventDefault(); e.stopPropagation();
            if (this.classList.contains('card')) {
                document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
            }
            const link = this.getAttribute('data-link');
            if (link) setTimeout(() => window.open(link, '_blank'), 150);
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');

            function performSearch() {
                const query = searchInput.value.toLowerCase().trim();
                if (query === '') {
                    renderCards('cards-movies', movies.slice(0, ITEMS_PER_PAGE));
                    renderCards('cards-new-movies', newMovies.slice(0, ITEMS_PER_PAGE));
                    renderOffersPage(1);
                    return;
                }
                const filteredMovies = movies.filter(movie => movie.title.toLowerCase().includes(query));
                renderCards('cards-movies', filteredMovies.length ? filteredMovies : movies.slice(0, ITEMS_PER_PAGE));
                renderCards('cards-new-movies', filteredMovies.length ? filteredMovies : newMovies.slice(0, ITEMS_PER_PAGE));
                const filteredOffers = offersDatabase.filter(offer => offer.title.toLowerCase().includes(query));
                if (filteredOffers.length) {
                    renderCards('cards-offers', filteredOffers.slice(0, ITEMS_PER_PAGE));
                } else {
                    renderOffersPage(1);
                }
            }
            if (searchButton) searchButton.addEventListener('click', performSearch);
            if (searchInput) searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        }

        function initScrollButtons() {
            const newMoviesLeft = document.querySelector('.new-movies-left');
            const newMoviesRight = document.querySelector('.new-movies-right');

            if (newMoviesLeft) {
                newMoviesLeft.addEventListener('click', () => {
                    document.getElementById('cards-new-movies').scrollBy({ left: -300, behavior: 'smooth' });
                    stopAutoScroll('cards-new-movies');
                    setTimeout(() => startAutoScroll('cards-new-movies'), 5000);
                });
            }

            if (newMoviesRight) {
                newMoviesRight.addEventListener('click', () => {
                    document.getElementById('cards-new-movies').scrollBy({ left: 300, behavior: 'smooth' });
                    stopAutoScroll('cards-new-movies');
                    setTimeout(() => startAutoScroll('cards-new-movies'), 5000);
                });
            }

            const moviesLeft = document.querySelector('.movies-left');
            const moviesRight = document.querySelector('.movies-right');

            if (moviesLeft) {
                moviesLeft.addEventListener('click', () => {
                    document.getElementById('cards-movies').scrollBy({ left: -300, behavior: 'smooth' });
                    stopAutoScroll('cards-movies');
                    setTimeout(() => startAutoScroll('cards-movies'), 5000);
                });
            }

            if (moviesRight) {
                moviesRight.addEventListener('click', () => {
                    document.getElementById('cards-movies').scrollBy({ left: 300, behavior: 'smooth' });
                    stopAutoScroll('cards-movies');
                    setTimeout(() => startAutoScroll('cards-movies'), 5000);
                });
            }
        }

        function initPageButtons() {
            const navPrev = document.getElementById('nav-prev');
            const navNext = document.getElementById('nav-next');

            if (navPrev) {
                navPrev.addEventListener('click', function() {
                    const activeBtn = document.querySelector('.load-page-button.active');
                    if (activeBtn) {
                        const currentPageNum = parseInt(activeBtn.getAttribute('data-page'));
                        if (currentPageNum > 1) {
                            const newPage = currentPageNum - 1;
                            renderOffersPage(newPage);
                            if (newPage < currentDisplayPage) {
                                renderPageButtons(Math.max(1, currentDisplayPage - 5));
                            }
                            stopAutoScroll('cards-offers');
                            setTimeout(() => startAutoScroll('cards-offers'), 5000);
                        }
                    }
                });
            }

            if (navNext) {
                navNext.addEventListener('click', function() {
                    const activeBtn = document.querySelector('.load-page-button.active');
                    if (activeBtn) {
                        const currentPageNum = parseInt(activeBtn.getAttribute('data-page'));
                        const newPage = currentPageNum + 1;
                        while (totalPages < newPage) { addNewPage(); }
                        renderOffersPage(newPage);
                        if (newPage >= currentDisplayPage + 5) {
                            renderPageButtons(currentDisplayPage + 5);
                        }
                        stopAutoScroll('cards-offers');
                        setTimeout(() => startAutoScroll('cards-offers'), 5000);
                    }
                });
            }

            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`page-${i}`);
                if (btn) {
                    btn.addEventListener('click', function() {
                        renderOffersPage(parseInt(this.getAttribute('data-page')));
                        stopAutoScroll('cards-offers');
                        setTimeout(() => startAutoScroll('cards-offers'), 5000);
                        document.querySelectorAll('.load-page-button').forEach(btn => btn.classList.remove('active'));
                        this.classList.add('active');
                    });
                }
            }
        }

        function initPage() {
            const loadingBar = document.getElementById('loading-bar');
            if (loadingBar) {
                setTimeout(() => {
                    loadingBar.style.opacity = '0';
                    setTimeout(() => loadingBar.style.display = 'none', 500);
                }, 1500);
            }

            renderCards('cards-movies', movies.slice(0, ITEMS_PER_PAGE));
            renderCards('cards-new-movies', newMovies.slice(0, ITEMS_PER_PAGE));
            renderOffersPage(1);

            initSearch();
            initScrollButtons();
            initPageButtons();

            renderPageButtons(1);

            setTimeout(() => {
                startAutoScroll('cards-movies', 3500);
                startAutoScroll('cards-new-movies', 2500);
                startAutoScroll('cards-offers', 3000);
            }, 2000);

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    stopAutoScroll('cards-movies');
                    stopAutoScroll('cards-new-movies');
                    stopAutoScroll('cards-offers');
                } else {
                    setTimeout(() => {
                        startAutoScroll('cards-movies', 3500);
                        startAutoScroll('cards-new-movies', 3500);
                        startAutoScroll('cards-offers', 3000);
                    }, 1000);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initPage);
        window.changeEpisode = function(episode) { window.currentEpisode = episode; };
    </script>
</body>
</html>
